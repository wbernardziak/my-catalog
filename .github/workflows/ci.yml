name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:colors
      - run: npm run lint:contrast
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - run: npm test

  # The database suite runs on its own so the fast hermetic job above stays the
  # signal most pushes need. It boots a real local Supabase stack, which is the
  # only way to observe RLS behaviour — see src/test/db/README.md.
  db-tests:
    runs-on: ubuntu-latest
    # A hung image pull would otherwise burn the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only db + auth + rest are needed. Analytics/vector in particular is the
      # most common `supabase start` failure on hosted runners.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,storage-api,mailpit
      - run: npm run test:db
      - if: always()
        run: npx supabase stop
